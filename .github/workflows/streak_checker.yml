name: Update Daily Streak

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows for manual triggering

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit changes to the repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Calculate Contribution Streak
        id: get_streak
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          USERNAME: IMOitself
        run: |
          GRAPHQL_QUERY="query { user(login: \"$USERNAME\") { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }"
          
          # Make the API call and store the response
          response=$(curl -s -H "Authorization: bearer $GITHUB_TOKEN" -X POST -d "{ \"query\": \"$GRAPHQL_QUERY\" }" https://api.github.com/graphql)
          
          # DEBUG: Print the raw response from GitHub to see if it's an error
          echo "--- API Response ---"
          echo "$response"
          echo "--------------------"
          
          # Check if the response contains actual user data before processing
          user_data_exists=$(echo "$response" | jq '.data.user')
          if [ "$user_data_exists" == "null" ] || [ -z "$user_data_exists" ]; then
            echo "Error: Could not retrieve user data. Check if USERNAME is correct and GH_PAT is valid."
            # Set streak to 0 to avoid breaking subsequent steps
            echo "streak=0" >> $GITHUB_ENV
            exit 0
          fi

          # If we get here, data is valid and we can calculate the streak
          current_streak=0
          today=$(date -u +"%Y-%m-%d")
          yesterday=$(date -u -d "yesterday" +"%Y-%m-%d")
          
          contributed_today=$(echo "$response" | jq --arg date "$today" '.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date == $date and .contributionCount > 0) | .contributionCount')
          contributed_yesterday=$(echo "$response" | jq --arg date "$yesterday" '.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[] | select(.date == $date and .contributionCount > 0) | .contributionCount')
          
          if [ -n "$contributed_today" ]; then
            current_streak=$(echo "$response" | jq -r '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]] | reverse | .[] | .contributionCount' | awk 'BEGIN {c=0} {if ($1 > 0) c++; else exit} END{print c}')
          elif [ -n "$contributed_yesterday" ]; then
            current_streak=$(echo "$response" | jq -r '[.data.user.contributionsCollection.contributionCalendar.weeks[].contributionDays[]] | reverse | .[1:] | .[] | .contributionCount' | awk 'BEGIN {c=0} {if ($1 > 0) c++; else exit} END{print c}')
          fi
          
          echo "Current streak: $current_streak days"
          echo "streak=$current_streak" >> $GITHUB_ENV
          
      - name: Update README.md
        env:
            # The env variable from the previous step is automatically available
            streak: ${{ steps.get_streak.outputs.streak }}
        run: |
          # This command looks for the placeholder and replaces the number
          # Make sure your README has a line like "My current streak: 0 days"
          sed -i "s/current streak: .* days/current streak: ${{ env.streak }} days/" README.md

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update daily streak"
          file_pattern: README.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
