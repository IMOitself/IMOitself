name: Update Total Contributions in README

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allows manual triggering

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub Contributions
        id: get_contributions
        run: |
          USERNAME="IMOitself" # Replace with the actual GitHub username
          GH_TOKEN="${{ secrets.GH_PAT }}"

          # Use GitHub GraphQL API to get total contributions
          # This query gets the totalContributions for the past year, which is what the profile graph shows.
          # If you need all-time, it's more complex and might involve iterating through years.
          # For a single user's profile, the 'totalContributions' in the 'contributionCalendar' is usually what people mean.
          TOTAL_CONTRIBUTIONS=$(curl -s -H "Authorization: bearer $GH_TOKEN" -X POST -d '{"query": "query { user(login: \"'$USERNAME'\") { contributionsCollection { contributionCalendar { totalContributions } } } }"}' https://api.github.com/graphql | jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')

          echo "Total contributions for $USERNAME: $TOTAL_CONTRIBUTIONS"
          echo "TOTAL_CONTRIBUTIONS=$TOTAL_CONTRIBUTIONS" >> $GITHUB_ENV

      - name: Update README.md
        run: |
          README_FILE="README.md"
          NEW_LINE="total contributions: ${{ env.TOTAL_CONTRIBUTIONS }}"

          # Check if the line already exists
          if grep -q "total contributions:" "$README_FILE"; then
            # Replace the existing line
            sed -i "s/^total contributions: .*/$NEW_LINE/" "$README_FILE"
          else
            # Add the line if it doesn't exist (e.g., at the end of the file)
            echo "$NEW_LINE" >> "$README_FILE"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update total contributions in README"
          # Ensure this action has write permissions.
          # The default GITHUB_TOKEN usually has sufficient permissions for the current repo.
          # If you used your GH_PAT for the API call, you might need to use it here too if default token isn't enough,
          # but it's generally better to use GITHUB_TOKEN for repo changes if possible.
          token: ${{ secrets.GITHUB_TOKEN }} # Use the default GitHub token for pushing
